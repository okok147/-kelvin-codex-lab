<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#EEEDE6">
  <meta name="description" content="Asympta World — a living pixel map where personal and business Agents carry local information, products and services.">
  <title>Asympta World</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./asympta.css">
  <link rel="stylesheet" href="./simulation.css">
  <link rel="stylesheet" href="./activity.css">
  <link rel="stylesheet" href="./terminal.css">
  <link rel="stylesheet" href="./local-world.css">
  <link rel="stylesheet" href="./store-art.css">
  <link rel="stylesheet" href="./pet-agents.css">
  <link rel="stylesheet" href="./product-world.css">
  <link rel="stylesheet" href="./agent-demo.css">
  <link rel="stylesheet" href="./agent-interaction.css">
</head>
<body>
<main id="app" class="product-map-mode">
  <header>
    <div class="brand"><b class="mark">●╱●╲●</b><div><strong>Asympta World</strong><small>Local life, carried by Agents.</small></div></div>
    <div class="presence" aria-label="Agent legend"><span class="presence-item human"><i></i>Personal Agent</span><span class="presence-item agent"><i></i>Store Agents</span></div>
    <div class="actions"><div id="mcp"><i></i><span>Checking WebMCP</span></div></div>
  </header>
  <section id="viewport" aria-label="Asympta local business and services pixel map">
    <div id="world"><svg id="edges" viewBox="0 0 3600 2400" aria-hidden="true"></svg><div id="nodes" aria-hidden="true"></div></div>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="./map-camera.js"></script>
<script src="./simulation.js"></script>
<script src="./activity.js"></script>
<script src="./terminal.js"></script>
<script src="./local-world.js"></script>
<script src="./store-art.js"></script>
<script src="./pet-observer-scope.js"></script>
<script src="./pet-agents.js"></script>
<script src="./agent-interaction.js"></script>
<script src="./agent-demo.js"></script>
<script src="./mcp-status.js"></script>
</body>
</html>
