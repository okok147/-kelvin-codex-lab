name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_BASE_PATH: "/-kelvin-codex-lab"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Publish the gh-pages branch
        env:
          GH_PAGES_DIR: ${{ runner.temp }}/gh-pages
        run: |
          touch out/.nojekyll
          git fetch origin gh-pages
          git worktree add "$GH_PAGES_DIR" origin/gh-pages
          git -C "$GH_PAGES_DIR" rm -rf .
          cp -R out/. "$GH_PAGES_DIR"/
          git -C "$GH_PAGES_DIR" add -A
          git -C "$GH_PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$GH_PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git -C "$GH_PAGES_DIR" diff --cached --quiet; then
            echo "No published changes."
            exit 0
          fi

          git -C "$GH_PAGES_DIR" commit -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git -C "$GH_PAGES_DIR" push origin HEAD:gh-pages
